name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: ruff check
        run: uv run ruff check
      - name: ruff format --check
        run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Build documentation
        run: uv run --locked --group docs zensical build --clean --strict
      - name: Validate documentation artifact
        run: uv run scripts/validate_docs_site.py site

  build-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Install each distribution and exercise public surfaces
        shell: bash
        run: |
          set -euo pipefail
          repo_root=$PWD
          printf '%s\n' "open('/ci/input.csv')" > /tmp/checker-smoke.py
          mkdir /tmp/score-smoke
          printf '%s\n' "print('score smoke')" > /tmp/score-smoke/main.py
          printf '%s\n' "# Score smoke" > /tmp/score-smoke/README.md

          for kind in wheel sdist; do
            if [[ $kind == wheel ]]; then
              distribution=("$repo_root"/dist/*.whl)
            else
              distribution=("$repo_root"/dist/*.tar.gz)
            fi
            environment="$repo_root/.ci-$kind"
            uv venv --python 3.14 "$environment"
            uv pip install --python "$environment/bin/python" "${distribution[@]}"

            cd /tmp
            env -u ANTHROPIC_API_KEY -u GH_TOKEN -u GITHUB_TOKEN \
              "$environment/bin/python" -c \
              "import json; from importlib.metadata import version; from importlib.resources import files; from reproready import check_path; assert version('reproready') == '0.2.0'; json.loads(files('reproready').joinpath('schemas/check-report-v1.schema.json').read_text()); assert check_path('/tmp/checker-smoke.py').schema_version == '1'"
            env -u ANTHROPIC_API_KEY -u GH_TOKEN -u GITHUB_TOKEN \
              "$environment/bin/reproready" check /tmp/checker-smoke.py \
              > "/tmp/checker-smoke-$kind.txt"
            env -u ANTHROPIC_API_KEY -u GH_TOKEN -u GITHUB_TOKEN \
              "$environment/bin/reproready" check /tmp/checker-smoke.py --json \
              > "/tmp/checker-smoke-$kind.json"
            env -u ANTHROPIC_API_KEY -u GH_TOKEN -u GITHUB_TOKEN \
              "$environment/bin/reproready" view "/tmp/checker-smoke-$kind.json" --plain \
              > "/tmp/checker-view-$kind.txt"
            env -u ANTHROPIC_API_KEY -u GH_TOKEN -u GITHUB_TOKEN \
              "$environment/bin/reproready" score /tmp/score-smoke --json \
              > "/tmp/score-smoke-$kind.json"
            "$environment/bin/python" -c \
              "import json; from pathlib import Path; kind='$kind'; report=json.loads(Path(f'/tmp/checker-smoke-{kind}.json').read_text()); assert report['schema_version'] == '1'; assert '\\x1b[' not in Path(f'/tmp/checker-smoke-{kind}.txt').read_text(); assert 'Artifact' in Path(f'/tmp/checker-view-{kind}.txt').read_text(); assert 'r' in json.loads(Path(f'/tmp/score-smoke-{kind}.json').read_text())"
          done
