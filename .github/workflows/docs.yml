name: Publish documentation

on:
  workflow_dispatch:
    inputs:
      reviewed_revision:
        description: Full default-branch commit SHA approved for publication
        required: true
        type: string
      package_version:
        description: ReproReady package version documented by this revision
        required: true
        default: "0.2.0"
        type: string
      review_confirmed:
        description: I reviewed this revision's rendered documentation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Verify reviewed default-branch revision
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVIEW_CONFIRMED: ${{ inputs.review_confirmed }}
          REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]
          [[ "$REVIEW_CONFIRMED" == "true" ]]
          [[ "$REVIEWED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEWED_REVISION" == "$GITHUB_SHA" ]]
      - name: Verify documented package version
        env:
          EXPECTED_VERSION: ${{ inputs.package_version }}
        run: >-
          uv run --locked python -c "import os, tomllib; from pathlib import Path;
          actual = tomllib.loads(Path('pyproject.toml').read_text())['project']['version'];
          expected = os.environ['EXPECTED_VERSION'];
          assert actual == expected, f'expected package version {expected}, found {actual}'"
      - name: Build documentation
        run: uv run --locked --group docs zensical build --clean --strict
      - name: Validate documentation artifact
        run: uv run scripts/validate_docs_site.py site
      - name: Record reviewed publication input
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
        run: |
          printf '### Reviewed documentation publication\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Revision: `%s`\n' "$REVIEWED_REVISION" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Package version: `%s`\n' "$PACKAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
