name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing protected release tag to build and publish
        required: true
        type: string
      wheel_sha256:
        description: SHA-256 of the verified wheel
        required: true
        type: string
      sdist_sha256:
        description: SHA-256 of the verified source distribution
        required: true
        type: string
      release_notes_reviewed:
        description: Confirm that the draft assets and generated notes were reviewed
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag }}
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Verify tag, review confirmation, and exact-commit CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          EXPECTED_SDIST_SHA256: ${{ inputs.sdist_sha256 }}
          RELEASE_NOTES_REVIEWED: ${{ inputs.release_notes_reviewed }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n $RELEASE_TAG ]]
          [[ $RELEASE_NOTES_REVIEWED == true ]]
          [[ $EXPECTED_WHEEL_SHA256 =~ ^[0-9a-f]{64}$ ]]
          [[ $EXPECTED_SDIST_SHA256 =~ ^[0-9a-f]{64}$ ]]

          version=$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          [[ $RELEASE_TAG == "v$version" ]]
          release_sha=$(git rev-parse HEAD)
          [[ $(git describe --tags --exact-match "$release_sha") == "$RELEASE_TAG" ]]
          owner_reviewer_count=$(gh api \
            "repos/$GITHUB_REPOSITORY/environments/pypi" \
            --jq ".protection_rules | map(select(.type == \"required_reviewers\")) | map(.reviewers[]) | map(select(.type == \"User\" and .reviewer.login == \"$GITHUB_REPOSITORY_OWNER\")) | length")
          (( owner_reviewer_count >= 1 ))

          ci_run_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"$release_sha\" and .conclusion == \"success\") | .id")
          [[ -n $ci_run_id ]]
      - name: Build and check distributions
        env:
          EXPECTED_WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          EXPECTED_SDIST_SHA256: ${{ inputs.sdist_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          uv build --no-sources
          uvx twine check --strict dist/*

          shopt -s nullglob
          wheel=(dist/*.whl)
          sdist=(dist/*.tar.gz)
          (( ${#wheel[@]} == 1 ))
          (( ${#sdist[@]} == 1 ))
          printf '%s  %s\n' "$EXPECTED_WHEEL_SHA256" "${wheel[0]}" | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_SDIST_SHA256" "${sdist[0]}" | sha256sum --check --strict
      - name: Install each distribution and exercise public surfaces
        shell: bash
        run: |
          set -euo pipefail
          repo_root=$PWD
          printf '%s\n' "open('/ci/input.csv')" > /tmp/checker-smoke.py
          mkdir /tmp/score-smoke
          printf '%s\n' "print('score smoke')" > /tmp/score-smoke/main.py
          printf '%s\n' "# Score smoke" > /tmp/score-smoke/README.md

          for kind in wheel sdist; do
            if [[ $kind == wheel ]]; then
              distribution=("$repo_root"/dist/*.whl)
            else
              distribution=("$repo_root"/dist/*.tar.gz)
            fi
            environment="$repo_root/.release-$kind"
            uv venv --python 3.14 "$environment"
            uv pip install --python "$environment/bin/python" "${distribution[@]}"

            cd /tmp
            env -u ANTHROPIC_API_KEY -u GH_TOKEN -u GITHUB_TOKEN \
              "$environment/bin/python" -c \
              "import json; from importlib.metadata import version; from importlib.resources import files; from reproready import check_path; assert version('reproready') == '0.2.0'; json.loads(files('reproready').joinpath('schemas/check-report-v1.schema.json').read_text()); assert check_path('/tmp/checker-smoke.py').schema_version == '1'"
            env -u ANTHROPIC_API_KEY -u GH_TOKEN -u GITHUB_TOKEN \
              "$environment/bin/reproready" check /tmp/checker-smoke.py --json \
              > "/tmp/checker-smoke-$kind.json"
            env -u ANTHROPIC_API_KEY -u GH_TOKEN -u GITHUB_TOKEN \
              "$environment/bin/reproready" view "/tmp/checker-smoke-$kind.json" --plain \
              > "/tmp/checker-view-$kind.txt"
            env -u ANTHROPIC_API_KEY -u GH_TOKEN -u GITHUB_TOKEN \
              "$environment/bin/reproready" score /tmp/score-smoke --json \
              > "/tmp/score-smoke-$kind.json"
          done
      - name: Verify reviewed draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) == false ]]
          [[ $(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease) == true ]]
          [[ -n $(gh release view "$RELEASE_TAG" --json body --jq .body) ]]

          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --pattern '*.whl' --pattern '*.tar.gz'
          for distribution in dist/*; do
            cmp "$distribution" "release-assets/$(basename "$distribution")"
          done
      - name: Store the verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-to-pypi:
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reproready
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Recheck hashes and any partial PyPI upload
        env:
          EXPECTED_WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          EXPECTED_SDIST_SHA256: ${{ inputs.sdist_sha256 }}
          RELEASE_VERSION: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheel=(dist/*.whl)
          sdist=(dist/*.tar.gz)
          (( ${#wheel[@]} == 1 ))
          (( ${#sdist[@]} == 1 ))
          printf '%s  %s\n' "$EXPECTED_WHEEL_SHA256" "${wheel[0]}" | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_SDIST_SHA256" "${sdist[0]}" | sha256sum --check --strict

          RELEASE_VERSION=${RELEASE_VERSION#v} python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen

          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir()
          }
          try:
              with urlopen(
                  f"https://pypi.org/pypi/reproready/{os.environ['RELEASE_VERSION']}/json",
                  timeout=30,
              ) as response:
                  published = json.load(response)["urls"]
          except HTTPError as error:
              if error.code != 404:
                  raise
              published = []

          for item in published:
              filename = item["filename"]
              if filename not in expected:
                  raise SystemExit(f"unexpected existing PyPI file: {filename}")
              if item["digests"]["sha256"] != expected[filename]:
                  raise SystemExit(f"PyPI hash mismatch: {filename}")
          PY
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
