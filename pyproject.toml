[project]
name = "reproready"
version = "0.1.0"
description = "Static reproduction-readiness scoring for code artifacts — how well an archive equips a researcher to reproduce results, judged without running any code."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Adhithya Bhaskar", email = "adhithyabhaskar@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["reproducibility", "research-artifacts", "static-analysis", "code-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

# The scoring core is standard-library only. `rich` is used solely by the CLI
# renderer; `anthropic` (the `llm` extra) solely by the optional Validation call.
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
reproready = "reproready.cli:main"

[project.urls]
Homepage = "https://github.com/adbX/reproready"
Repository = "https://github.com/adbX/reproready"
Changelog = "https://github.com/adbX/reproready/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
    "zensical>=0.0.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reproready"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# A stable, explicit rule set so a ruff upgrade cannot silently redefine what a
# clean run means. Widening it is a deliberate, separate decision.
select = ["E4", "E7", "E9", "F", "I"]
