[project]
name = "reproready"
version = "0.2.0"
description = "Static inspection and reproduction-readiness scoring for code artifacts, without running artifact code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Adhithya Bhaskar", email = "adhithyabhaskar@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["reproducibility", "research-artifacts", "static-analysis", "code-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

# The score modules are standard-library only. `rich` and `textual` support the
# CLI renderer and interactive saved-report browser; `anthropic` (the `llm`
# extra) is used solely by the optional Validation call. Checker-only
# dependencies stay outside the score pipeline.
dependencies = [
    "packaging>=24.0",
    "jsonschema>=4.23",
    "rich>=13.0",
    "textual>=8.2.8",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
reproready = "reproready.cli:main"

[project.urls]
Homepage = "https://reproready.com/"
Documentation = "https://reproready.com/"
Repository = "https://github.com/adbX/reproready"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.15",
]
docs = [
    "mkdocstrings-python>=2.0.8",
    "zensical>=0.0.63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/.cache",
    "/.github",
    "/.gitignore",
    "/.python-version",
    "/.rumdl_cache",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/uv.lock",
    "/site",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reproready"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# A stable, explicit rule set so a ruff upgrade cannot silently redefine what a
# clean run means. Widening it is a deliberate, separate decision.
select = ["E4", "E7", "E9", "F", "I"]
