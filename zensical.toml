# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
site_name        = "ReproReady"
site_description = "Static reproduction-readiness scoring for code artifacts — judged without running any code."
site_author      = "Adhithya Bhaskar"
site_url         = "https://github.com/adbX/reproready"

repo_url  = "https://github.com/adbX/reproready"
repo_name = "adbX/reproready"
edit_uri  = "edit/main/docs/"

docs_dir = "docs"
site_dir = "site"

copyright = "&copy; 2026 Adhithya Bhaskar &nbsp;&middot;&nbsp; MIT"

extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

# ---------------------------------------------------------------------------
# Theme — modern variant, light/dark with system preference
# ---------------------------------------------------------------------------

[project.theme]
variant = "modern"
features = [
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.action.edit",
]

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/pencil"

[[project.theme.palette]]
media   = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media   = "(prefers-color-scheme: light)"
scheme  = "default"
primary = "indigo"
accent  = "deep-purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media   = "(prefers-color-scheme: dark)"
scheme  = "slate"
primary = "indigo"
accent  = "deep-purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------

nav = [
  { "Home"                     = "index.md" },
  { "Specification"            = "spec.md" },
  { "Implementation reference" = "implementation.md" },
  { "CLI"                      = "cli.md" },
]

# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink       = true
permalink_title = "Anchor link to this section"
toc_depth       = 3

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums     = true
line_spans          = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
